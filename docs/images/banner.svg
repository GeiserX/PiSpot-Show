<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#43A047;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1B5E20;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C8E6C9;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" rx="12" ry="12" fill="url(#bgGrad)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.06">
    <line x1="0" y1="40" x2="900" y2="40" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="80" x2="900" y2="80" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="120" x2="900" y2="120" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="160" x2="900" y2="160" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- Display / Monitor icon -->
  <g transform="translate(80, 38)">
    <!-- Monitor outer frame -->
    <rect x="0" y="0" width="120" height="85" rx="8" ry="8" fill="#1B5E20" opacity="0.4" />
    <rect x="4" y="4" width="112" height="77" rx="5" ry="5" fill="url(#screenGrad)" />

    <!-- Screen content: WiFi icon -->
    <g transform="translate(60, 32)" fill="none" stroke="#2E7D32" stroke-width="3.5" stroke-linecap="round">
      <!-- WiFi arcs -->
      <path d="M-22,-8 A 30,30 0 0,1 22,-8" />
      <path d="M-14,-2 A 20,20 0 0,1 14,-2" />
      <path d="M-7,4 A 10,10 0 0,1 7,4" />
      <!-- WiFi dot -->
      <circle cx="0" cy="12" r="3" fill="#2E7D32" stroke="none" />
    </g>

    <!-- Voucher code on screen -->
    <text x="60" y="70" text-anchor="middle" fill="#1B5E20" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="2">A7X-9K2</text>

    <!-- Monitor stand -->
    <rect x="45" y="85" width="30" height="10" rx="2" ry="2" fill="#1B5E20" opacity="0.4" />
    <rect x="35" y="95" width="50" height="6" rx="3" ry="3" fill="#1B5E20" opacity="0.4" />

    <!-- Raspberry Pi board (behind monitor, peeking out) -->
    <g transform="translate(90, 60)" opacity="0.55">
      <rect x="0" y="0" width="32" height="22" rx="2" ry="2" fill="#2E7D32" stroke="#1B5E20" stroke-width="1"/>
      <!-- GPIO pins -->
      <g fill="#A5D6A7">
        <rect x="2" y="-3" width="2" height="3"/>
        <rect x="6" y="-3" width="2" height="3"/>
        <rect x="10" y="-3" width="2" height="3"/>
        <rect x="14" y="-3" width="2" height="3"/>
        <rect x="18" y="-3" width="2" height="3"/>
        <rect x="22" y="-3" width="2" height="3"/>
        <rect x="26" y="-3" width="2" height="3"/>
      </g>
      <!-- CPU -->
      <rect x="10" y="6" width="12" height="10" rx="1" ry="1" fill="#1B5E20"/>
    </g>
  </g>

  <!-- Title text -->
  <text x="270" y="95" fill="#FFFFFF" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-1">PiSpot-Show</text>

  <!-- Subtitle -->
  <text x="270" y="130" fill="#C8E6C9" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400">Raspberry Pi WiFi Voucher Display System</text>

  <!-- Decorative dots -->
  <g fill="#A5D6A7" opacity="0.3">
    <circle cx="830" cy="30" r="4"/>
    <circle cx="850" cy="30" r="4"/>
    <circle cx="870" cy="30" r="4"/>
    <circle cx="830" cy="50" r="4"/>
    <circle cx="850" cy="50" r="4"/>
    <circle cx="870" cy="50" r="4"/>
  </g>

  <!-- Bottom accent line -->
  <rect x="270" y="145" width="80" height="3" rx="1.5" fill="#A5D6A7" opacity="0.6"/>
</svg>
